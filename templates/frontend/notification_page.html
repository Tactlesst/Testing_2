{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row px-3 pt-3">
        <div class="col-lg-8">
            <h1 class="font-weight-bold">{{ tab_title }}</h1>
            <ol class="breadcrumb bg-transparent p-0">
                <li class="breadcrumb-item">
                    <a href="{% url 'backend-dashboard' %}">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <strong>{{ tab_parent }}</strong>
                </li>
                <li class="breadcrumb-item active">
                    <strong>{{ tab_title }}</strong>
                </li>
            </ol>
        </div>
    </div>
</div>

<div class="content-wrapper p-4 ml-0">
    <div class="card">
        <div class="card-body p-2">
            <div class="d-flex justify-content-end px-2 pt-2">
                <button type="button" class="btn btn-sm btn-light" id="lds-notif-history-mark-all">Mark all as read</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="lds-notif-history-table">
                    <thead>
                        <tr>
                            <th style="width: 35%;">Training</th>
                            <th style="width: 25%;">From</th>
                            <th style="width: 20%;">Date</th>
                            <th style="width: 15%;">Status</th>
                            <th style="width: 5%;"></th>
                        </tr>
                    </thead>
                    <tbody id="lds-notif-history-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script src="{% static 'js/notification/notification-history.js' %}?v=1"></script>
{% endblock %}
